<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application — Excel Auto</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="ui.js" defer></script>
  <script src="application.js" defer></script>
</head>
<body class="app-page">
  <header class="topbar">
    <div class="wrap wrap-wide topbar-inner">
      <a class="brand" href="./" aria-label="Excel Auto, accueil">
        <span class="brand-mark" aria-hidden="true">XA</span>
        <span id="app-title">Application</span>
      </a>
      <div class="actions">
        <button type="button" class="btn" data-action="export">Exporter en Excel</button>
      </div>
    </div>

  <div class="wrap wrap-wide app-layout">
    <nav id="app-nav" class="app-nav" aria-label="Navigation de l'application"></nav>
    <main id="app-main" class="app-main" aria-live="polite">
      <div class="state"><div class="spinner" aria-hidden="true"></div><p>Chargement…</p></div>

  </div>

  <dialog id="row-dialog" class="modal modal-wide" aria-labelledby="row-dialog-title"></dialog>
